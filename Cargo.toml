[package]
name = "automall"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.10"
graph-cycles = "0.3.0"
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
